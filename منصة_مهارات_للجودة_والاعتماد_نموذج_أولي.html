<title>منصة مهارات للجودة والاعتماد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: calm institutional console — deep sea-blue rail on the right (RTL), soft mint-grey canvas, teal for structure, warm amber only where attention is needed */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --surface-2:#ebf3f1; --line:#d9e5e2; --ink:#1c2c33; --ink-2:#4a5d64; --ink-3:#7b8c92;
  --navy:#0e3b5c; --navy-2:#155277; --accent:#1d8483; --accent-soft:#ddf1ee; --rail-ink:#d3e6ea;
  --warm:#e0862f; --warm-soft:#fdf0e1; --rail:linear-gradient(180deg,#0e3b5c 0%,#124a62 60%,#15566a 100%);
  --ok:#2f8a5b; --ok-bg:#e2f3e9; --warn:#b07316; --warn-bg:#fcf1dc; --bad:#c2524a; --bad-bg:#fbe8e5; --info:#3878a3; --info-bg:#e3eff7; --mute-bg:#ecf0f1;
  --shadow:0 1px 2px rgba(14,59,92,.05),0 6px 18px rgba(14,59,92,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px; --railw:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#15242b; --surface-2:#1b2e36; --line:#27404a; --ink:#e4eef0; --ink-2:#a9bec4; --ink-3:#7f959b;
  --navy:#0b2f47; --navy-2:#134563; --accent:#4fbdb6; --accent-soft:#183a3c; --rail-ink:#c9e0e4;
  --warm:#f0a35c; --warm-soft:#3a2a18; --rail:linear-gradient(180deg,#0a2638 0%,#0d3341 100%);
  --ok:#62c48f; --ok-bg:#163a2a; --warn:#e8b45c; --warn-bg:#392d16; --bad:#ec8a80; --bad-bg:#3d2020; --info:#79b3dc; --info-bg:#183044; --mute-bg:#20313a;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#15242b; --surface-2:#1b2e36; --line:#27404a; --ink:#e4eef0; --ink-2:#a9bec4; --ink-3:#7f959b;
  --navy:#0b2f47; --navy-2:#134563; --accent:#4fbdb6; --accent-soft:#183a3c; --rail-ink:#c9e0e4;
  --warm:#f0a35c; --warm-soft:#3a2a18; --rail:linear-gradient(180deg,#0a2638 0%,#0d3341 100%);
  --ok:#62c48f; --ok-bg:#163a2a; --warn:#e8b45c; --warn-bg:#392d16; --bad:#ec8a80; --bad-bg:#3d2020; --info:#79b3dc; --info-bg:#183044; --mute-bg:#20313a;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons, badges ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.warm:hover{filter:brightness(1.05)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-draft{background:var(--mute-bg);color:var(--ink-2)}
.st-uploaded{background:var(--info-bg);color:var(--info)}
.st-review{background:var(--accent-soft);color:var(--accent)}
.st-rework{background:var(--warn-bg);color:var(--warn)}
.st-approved{background:var(--ok-bg);color:var(--ok)}
.st-rejected{background:var(--bad-bg);color:var(--bad)}
.st-replaced{background:var(--mute-bg);color:var(--ink-3)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600}
.lvl{font-weight:700;border-radius:6px;padding:1px 8px;font-size:12.5px}
.lvl-0{background:var(--mute-bg);color:var(--ink-2)} .lvl-1{background:var(--info-bg);color:var(--info)} .lvl-2{background:var(--warn-bg);color:var(--warn)} .lvl-3{background:var(--bad-bg);color:var(--bad)}

/* ---------- public ---------- */
.pub{min-height:100%;display:flex;flex-direction:column}
.pub-top{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;color:var(--navy)}
:root[data-theme="dark"] .pub-top .brand{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pub-top .brand{color:var(--ink)}}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-3)}
.hero{padding:clamp(28px,6vw,72px) clamp(16px,4vw,48px) 28px;display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;max-width:1200px;margin-inline:auto;width:100%}
.hero h1{font-size:clamp(28px,4vw,44px);color:var(--navy)}
.hero h1 em{font-style:normal;color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero h1{color:var(--ink)}}
:root[data-theme="dark"] .hero h1{color:var(--ink)}
.hero p{color:var(--ink-2);font-size:17px;max-width:60ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.flow-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.flow-card h3{font-size:15px;color:var(--ink-2);margin-bottom:12px}
.flow{display:flex;flex-direction:column;gap:8px}
.flow-step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--surface-2)}
.flow-step:last-child{background:var(--warm-soft)}
.flow-step b{font-family:var(--f-display);font-size:14px}
.flow-step span{color:var(--ink-3);font-size:13px;margin-inline-start:auto}
.sec{max-width:1200px;margin-inline:auto;width:100%;padding:28px clamp(16px,4vw,48px)}
.sec h2{font-size:22px;margin-bottom:14px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.feat b{display:block;font-family:var(--f-display);margin-bottom:4px;color:var(--navy)}
:root[data-theme="dark"] .feat b{color:var(--accent)}
.feat p{margin:0;color:var(--ink-2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--rail);color:#fff;border-radius:var(--r);padding:16px}
.stat b{font-family:var(--f-display);font-size:30px;display:block}
.stat span{color:#c8d6f0;font-size:13.5px}
.pub-foot{margin-top:auto;background:var(--rail);color:#c8d6f0;padding:22px clamp(16px,4vw,48px);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:13.5px}
.pub-foot b{color:#fff}

/* ---------- login ---------- */
.login-wrap{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login-side{background:var(--rail);color:#fff;padding:48px clamp(16px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login-side h2{font-size:30px}
.login-side p{color:#c8d6f0;max-width:44ch}
.login-side ul{padding:0;margin:0;list-style:none;display:grid;gap:8px;color:#dce6f7}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login-form form{width:100%;max-width:420px;display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.demo-box{border:1px dashed var(--warm);background:var(--warm-soft);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.demo-box p{margin:0;font-size:13px;color:var(--ink-2)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:6px;font-size:14px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:var(--railw) 1fr;height:100%}
.shell.collapsed{--railw:72px}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;overflow-y:auto;transition:width .2s}
.rail .brand{color:#fff;padding:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.rail .brand small{color:#9fb3d9}
.nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14.5px;color:var(--rail-ink)}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav button:focus-visible{outline:2px solid #fff}
.nav .ico{width:20px;height:20px;flex:none}
.nav .cnt{margin-inline-start:auto;background:var(--warm);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
.nav-h{font-size:11.5px;letter-spacing:.04em;color:#8ea4cc;padding:12px 10px 4px}
.shell.collapsed .nav span.lbl,.shell.collapsed .nav-h,.shell.collapsed .rail .brand div,.shell.collapsed .nav .cnt{display:none}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .who{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.who-txt{line-height:1.3}
.who-txt b{display:block;font-size:14px}
.who-txt span{font-size:12.5px;color:var(--ink-3)}
.scope{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2);border:1px solid var(--line)}
.scope b{color:var(--ink)}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dot{position:absolute;top:6px;left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--warm);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.content{overflow-y:auto;padding:22px clamp(16px,2.5vw,32px) 48px;flex:1}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:24px}
.page-h p{margin:2px 0 0;color:var(--ink-3);font-size:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:15.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-family:var(--f-body);font-weight:500;color:var(--ink-3);font-size:12.5px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lab{color:var(--ink-3);font-size:13px}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:700}
.kpi .sub{font-size:12.5px;color:var(--ink-2)}
.kpi.alert{background:var(--warm-soft);border-color:transparent}
.kpi.alert .val{color:var(--warm)}
.kpi .val{color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi .val{color:var(--ink)}}
:root[data-theme="dark"] .kpi .val{color:var(--ink)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;font-size:14px;font-weight:600}
.list .it .t span{font-size:12.5px;color:var(--ink-3)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-family:var(--f-display);margin-bottom:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:13px;white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer}
th.sort:hover{color:var(--accent)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
td.c,th.c{text-align:center}
.clip{max-width:360px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.toolbar input[type=search]{min-width:220px;flex:1}
.lifecycle{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lifecycle .s{padding:6px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;font-weight:600}
.lifecycle .ar{color:var(--ink-3)}
.lifecycle .s.cur{background:var(--navy);color:#fff}
.raci{font-weight:700;border-radius:6px;display:inline-grid;place-items:center;width:28px;height:26px;font-size:13px}
.raci-R{background:var(--ok-bg);color:var(--ok)} .raci-A{background:var(--bad-bg);color:var(--bad)} .raci-C{background:var(--info-bg);color:var(--info)} .raci-I{background:var(--mute-bg);color:var(--ink-3)}
td.me,th.me{background:var(--accent-soft)!important}
.note{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:13.5px;color:var(--ink-2)}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.timeline .ev{display:grid;grid-template-columns:16px 1fr;gap:10px;padding-bottom:14px;position:relative}
.timeline .ev::before{content:"";position:absolute;right:7px;top:16px;bottom:0;width:2px;background:var(--line)}
.timeline .ev:last-child::before{display:none}
.timeline .ev i{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin-top:4px}
.timeline .ev b{font-size:14px}
.timeline .ev span{display:block;font-size:12.5px;color:var(--ink-3)}
.chain{display:flex;flex-wrap:wrap;gap:6px}
.chain span{font-size:12.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line)}
.chain span.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chain span.miss{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.hbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(5,15,40,.45);display:grid;place-items:center;z-index:60;padding:16px}
.backdrop{position:fixed;inset:0;background:rgba(5,15,40,.35);z-index:51}
.modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:grid;gap:12px}
.modal h3{font-size:18px}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.drawer{position:fixed;inset-block:0;left:0;width:min(760px,100%);background:var(--bg);z-index:52;box-shadow:0 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer-b{overflow-y:auto;padding:18px;display:grid;gap:14px}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;display:grid;gap:8px;z-index:70}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);max-width:360px}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.tip{position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;bottom:115%;right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;white-space:nowrap;z-index:30;font-weight:500}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.demo-flag{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:6px;font-weight:600}
.mobile-only{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .hero,.login-wrap{grid-template-columns:1fr}
  .login-side{padding:28px 16px}
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset-block:0;right:0;width:260px;z-index:45;transform:translateX(100%);transition:transform .2s}
  .shell.mob-open .rail{transform:none}
  .shell.collapsed .nav span.lbl,.shell.collapsed .nav-h{display:initial}
  .mobile-only{display:grid}
  .g2,.g4{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 40px}
  .who-txt{display:none}
}
</style>

<div id="root"></div>

function readiness(list){ return list.length ? Math.round(100 * list.filter(e => e.st === 'approved').length / list.length) : 0; }
function escalations(){
  return S.ev.filter(isLate).filter(e => e.br !== 'ALL').map(e => {
    const d = daysBetween(e.due, TODAY);
    const lvl = d >= 30 ? 3 : d >= 7 ? 2 : d >= 2 ? 1 : 0;
    const who = ['مسؤول الجودة بالفرع', `مدير الفرع + مشرف ${brCluster(e.br)}`, 'مدير الجودة والاعتماد', 'الإدارة العليا'][lvl];
    const sla = ['2 أيام', '5 أيام عمل', '7 أيام عمل', 'اجتماع مراجعة الإدارة القادم'][lvl];
    const nextA = ['تنفيذ المهمة أو طلب تأجيل مسبب', 'متابعة المسؤول وتحديد موعد بديل', 'فتح إجراء تصحيحي وتسجيله في تقرير أداء الفرع', 'عرضه في مراجعة الإدارة واتخاذ قرار'][lvl];
    const st = S.escNotes[e.id]?.closed ? 'مغلق' : (S.escNotes[e.id]?.manual ? 'مصعّد يدوياً' : 'مفتوح');
    return {e, d, lvl: S.escNotes[e.id]?.lvl ?? lvl, who, sla, nextA, st, since: e.due};
  }).filter(x => x.lvl > 0);
}
function myEscalations(){
  const u = S.user, all = escalations().filter(x => evVisible(x.e));
  if (u.role === 'QO') return all;
  if (u.role === 'BM' || u.role === 'QS') return all.filter(x => x.lvl >= 1);
  if (u.role === 'QD') return all.filter(x => x.lvl >= 1);
  if (u.role === 'TM') return all.filter(x => x.lvl >= 3);
  return [];
}

  const needs = vis.filter(e => can('submit', e).ok || can('review', e).ok || can('approve', e).ok || can('return', e).ok).slice(0, 6);

function hbar(nm, v){ return `<div class="hbar"><span class="nm">${esc(nm)}</span><div class="bar ${v>=70?'ok':v>=50?'warn':'bad'}"><i style="width:${v}%"></i></div><b class="num">${v}%</b></div>`; }

/* ---------- evidence list ---------- */
function evidence(){
  const F = S.evF;
  let l = S.ev.filter(e => evVisible(e));
  if (!l.length) return pageH('الشواهد','') + emptyState('لا توجد شواهد في نطاقك', 'دورك لا يملك وحدة الشواهد.');
  if (F.q) l = l.filter(e => (e.text + e.id + e.act + e.ind).includes(F.q));
  if (F.st) l = l.filter(e => e.st === F.st);
  if (F.br) l = l.filter(e => e.br === F.br);
  if (F.std) l = l.filter(e => e.std === F.std);
  l.sort((a, b) => String(a[F.sort]).localeCompare(String(b[F.sort]), 'ar') * F.dir);
  const brs = [...new Set(S.ev.filter(e => evVisible(e)).map(e => e.br))];
  const th = (k, t) => `<th class="sort" data-sort="${k}">${t}${F.sort===k ? (F.dir>0?' ▲':' ▼') : ''}</th>`;
  return pageH('الشواهد', `${l.length} شاهداً · الشواهد المركزية الموروثة تظهر للقراءة لكل الفروع`) + `
  <div class="toolbar"><input type="search" id="f-q" placeholder="بحث في نص الشاهد أو رقمه أو المؤشر" value="${esc(F.q)}">
   <select id="f-st"><option value="">كل الحالات</option>${Object.entries(ST).map(([k,v]) => `<option value="${k}" ${F.st===k?'selected':''}>${v}</option>`).join('')}</select>
   <select id="f-br"><option value="">كل الفروع</option>${brs.map(b => `<option value="${b}" ${F.br===b?'selected':''}>${b==='ALL'?'مركزي موروث':b+' '+BR[b].short}</option>`).join('')}</select>
   <select id="f-std"><option value="">كل المعايير</option>${DATA.std.map(s => `<option value="${s.n}" ${F.std===s.n?'selected':''}>المعيار ${s.n}</option>`).join('')}</select>
   ${(F.q||F.st||F.br||F.std)?'<button class="btn sm ghost" data-act="clearF">مسح الفلاتر</button>':''}</div>
  ${l.length ? `<div class="tbl-wrap"><table><thead><tr>${th('id','رقم الشاهد')}${th('br','الفرع')}${th('std','المعيار')}<th>العملية / النشاط</th><th>المسؤول</th>${th('st','الحالة')}${th('due','الاستحقاق')}${th('upd','آخر تحديث')}<th>الإجراء</th></tr></thead><tbody>
  ${l.map(e => `<tr class="clk" data-ev="${e.id}"><td class="num">${e.id}</td><td>${e.br==='ALL'?'<span class="tag">مركزي</span>':e.br+' '+BR[e.br].short}</td><td class="num">${e.ind}</td><td class="clip">${esc_(e.text,110)}<br><span class="tag">${e.act}</span></td><td>${esc(userById(e.byUser).name)}</td><td>${badge(e.st)}</td><td class="num" style="${isLate(e)?'color:var(--bad);font-weight:700':''}">${fmt(e.due)}</td><td class="num">${fmt(e.upd)}</td><td>${rowAction(e)}</td></tr>`).join('')}
  </tbody></table></div>` : emptyState('لا نتائج مطابقة', 'غيّر الفلاتر أو امسحها.')}`;
}
function rowAction(e){
  for (const [a, t, c] of [['submit','رفع/إرسال','primary'],['review','بدء المراجعة','primary'],['approve','اعتماد','ok']]) if (can(a, e).ok) return `<button class="btn sm ${c}" data-ev="${e.id}">${t}</button>`;
  return `<button class="btn sm" data-ev="${e.id}">عرض</button>`;
}

/* ---------- evidence detail drawer ---------- */
function openEv(id){
  const e = S.ev.find(x => x.id === id); if (!e) return;
  closeDrawer();
  const d = document.createElement('div'); d.id = 'drawerWrap';
  d.innerHTML = `<div class="backdrop" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="تفاصيل الشاهد">${evDetail(e)}</aside>`;
  document.body.appendChild(d); bindDrawer(e);
}
function closeDrawer(){ $('#drawerWrap')?.remove(); }
function chainState(e){
  const n = e.chain.length; const k = {draft:0, rework:2, uploaded:2, review:3, approved:n, rejected:2, replaced:n}[e.st] ?? 0;
  return e.chain.map((c, i) => `<span class="${i < k ? 'done' : 'miss'}">${i < k ? '✓' : '✗'} ${esc(c)}</span>`).join('');
}
function evDetail(e){
  const actions = [
    ['submit','إرسال للمراجعة','primary'],['review','بدء المراجعة الأولى','primary'],['return','إعادة للتعديل','bad'],
    ['approve','اعتماد الشاهد','ok'],['reject','رفض','bad'],['replace','استبدال بإصدار جديد',''],['audit','تسجيل ملاحظة تدقيق','']];
  // show only actions the role can ever perform; SoD-blocked approve is shown disabled with the reason
  const btns = actions.map(([a, t, c]) => { const r = can(a, e);
    if (r.ok) return `<button class="btn ${c}" data-do="${a}">${t}</button>`;
    if ((a === 'approve') && r.why.includes('الفصل بين المهام')) return `<button class="btn ok tip" disabled data-tip="${esc(r.why)}">${t}</button>`;
    return ''; }).join('');
  const sod = can('approve', e);
  return `<div class="drawer-h"><button class="iconbtn" data-act="closeDrawer" aria-label="إغلاق">${ico('x')}</button><div style="min-width:0"><b class="num">${e.id}</b> ${badge(e.st)} ${isLate(e)?'<span class="badge st-rejected">متأخر</span>':''}<div style="font-size:12.5px;color:var(--ink-3)">${brName(e.br)}</div></div></div>
  <div class="drawer-b">
   ${btns ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div>` : `<div class="note">لا توجد إجراءات متاحة لدورك على هذا الشاهد في حالته الحالية — العرض فقط.</div>`}
   ${!sod.ok && sod.why.includes('الفصل') ? `<div class="note bad">${esc(sod.why)}</div>` : ''}
   ${S.user.role==='SA' ? '<div class="note warn">مدير النظام لا يعتمد محتوى الجودة.</div>' : ''}
   <div class="card"><h3>الشاهد</h3><p style="margin:0">${esc(e.text)}</p></div>
   <div class="card"><h3>بيانات الشاهد</h3><dl class="kv">
     <dt>المعيار</dt><dd>${e.std}. ${esc(STD[e.std].name)}</dd><dt>المؤشر</dt><dd class="num">${e.ind}</dd><dt>رمز القالب</dt><dd class="num">${e.tpl}</dd>
     <dt>النشاط</dt><dd>${esc(e.act)} — ${esc(e.task)}</dd><dt>المسؤول</dt><dd>${esc(userById(e.byUser).name)} · المنفذ: ${esc(e.owner)}</dd>
     <dt>الدورية</dt><dd>${esc(e.per)}</dd><dt>الاستحقاق</dt><dd class="num">${fmt(e.due)}</dd><dt>النموذج</dt><dd>${esc(e.form)}</dd><dt>السجل الناتج</dt><dd>${esc(e.record)}</dd>
     <dt>المراجعة الأولى</dt><dd>${e.br==='ALL'?'مسؤول المعيار':'مشرف الجودة '+brCluster(e.br)}</dd><dt>الاعتماد</dt><dd>${e.br==='ALL'?'مدير الجودة المركزي':'مسؤول المعيار '+e.std}</dd>
     <dt>تاريخ الإنشاء</dt><dd class="num">${fmt('2026-09-01')}</dd><dt>آخر تحديث</dt><dd class="num">${fmt(e.upd)}</dd></dl></div>
   ${e.det ? `<div class="card"><h3>محدد قبول الشاهد <small>ما سيتحقق منه المقيّم</small></h3><p style="margin:0;color:var(--ink-2)">${esc(e.det)}</p></div>` : ''}
   <div class="card"><h3>حلقات الاستيفاء <small>لا يُعد مستوفى لمجرد رفع ملف</small></h3><div class="chain">${chainState(e)}</div></div>
   <div class="card"><h3>الملفات <small>${e.files.length}</small></h3>
     ${e.files.length ? `<div class="list">${e.files.map(f => `<div class="it"><span class="tag">PDF</span><div class="t"><b class="num">${esc(f)}</b></div></div>`).join('')}</div>` : emptyState('لم يُرفع أي ملف', '')}
     ${can('upload', e).ok ? `<div class="field" style="margin-top:8px"><label for="up-file">رفع ملف</label><input id="up-file" type="file"></div>` : ''}</div>
   <div class="card"><h3>النتيجة المستهدفة أمام المقيّم</h3><p style="margin:0;color:var(--ink-2)">${esc(e.outcome)}</p></div>
   <div class="card"><h3>التعليقات <small>${e.comments.length}</small></h3>
     ${e.comments.map(c => `<div class="it" style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="font-size:13.5px">${esc(c.who)}</b> <span style="font-size:12px;color:var(--ink-3)">${c.at}</span><div>${esc(c.t)}</div></div>`).join('') || '<p style="margin:0;color:var(--ink-3)">لا تعليقات.</p>'}
     ${can('comment', e).ok ? `<div class="field" style="margin-top:8px"><label for="cm-t">إضافة تعليق</label><textarea id="cm-t" rows="2"></textarea><button class="btn sm" data-do="comment" style="justify-self:start">إضافة</button></div>` : ''}</div>
   <div class="card"><h3>سجل الإجراءات</h3><div class="timeline">${[...e.log].reverse().map(l => `<div class="ev"><i></i><div><b>${esc(l.a)}</b><span>${esc(l.who)} · ${l.t}</span></div></div>`).join('')}</div></div>
  </div>`;
}
function bindDrawer(e){
  const w = $('#drawerWrap');
  w.querySelectorAll('[data-act="closeDrawer"]').forEach(b => b.onclick = closeDrawer);
  w.querySelectorAll('[data-do]').forEach(b => b.onclick = () => evAction(e, b.dataset.do));
  const f = w.querySelector('#up-file');
  if (f) f.onchange = () => { if (!f.files[0]) return; const r = can('upload', e); if (!r.ok) return toast(r.why, 'bad');
    e.files.push(f.files[0].name); e.log.push({t:TODAY, who:S.user.name, a:'رفع ملف: ' + f.files[0].name}); e.upd = TODAY; toast('تم رفع الملف', 'ok'); refreshDrawer(e); };
}
function refreshDrawer(e){ if ($('#drawerWrap')) { $('#drawerWrap .drawer').innerHTML = evDetail(e); bindDrawer(e); } render(); }
function evAction(e, a){
  const r = can(a === 'comment' ? 'comment' : a, e);
  if (!r.ok) return toast(r.why, 'bad');
  const u = S.user;
  if (a === 'comment'){ const t = $('#cm-t').value.trim(); if (!t) return toast('اكتب نص التعليق أولاً', 'bad');
    e.comments.push({who:u.name + ' (' + u.role + ')', t, at:TODAY}); e.log.push({t:TODAY, who:u.name, a:'تعليق'}); toast('أُضيف التعليق', 'ok'); return refreshDrawer(e); }
  const cfg = {
    submit:{t:'إرسال الشاهد للمراجعة', m:'سيُحال الشاهد إلى المراجعة الأولى، ولن تتمكن من تعديله إلا إذا أُعيد إليك.', to:'uploaded', need:e.files.length > 0 ? '' : 'ارفع ملفاً واحداً على الأقل قبل الإرسال.'},
    review:{t:'بدء المراجعة الأولى', m:'ستتحقق من اكتمال حلقات الاستيفاء ومطابقة محدد القبول، ثم يُحال لمسؤول المعيار للاعتماد.', to:'review'},
    return:{t:'إعادة الشاهد للتعديل', m:'اكتب سبب الإعادة ليصل إلى مسؤول الجودة بالفرع.', to:'rework', reason:true},
    approve:{t:'اعتماد الشاهد', m:'سيُسجل الشاهد «معتمد» ويُحتسب في نسبة الجاهزية، ويُقيد في سجل التدقيق. لا يُحذف الشاهد المعتمد بعد ذلك.', to:'approved'},
    reject:{t:'رفض الشاهد', m:'اكتب سبب الرفض. يُسجل في سجل التدقيق.', to:'rejected', reason:true},
    replace:{t:'استبدال الشاهد المعتمد', m:'لا يُحذف الشاهد المعتمد. سيُغلق الإصدار الحالي «مستبدل» ويُنشأ إصدار جديد كمسودة.', to:'replaced'},
    audit:{t:'ملاحظة تدقيق داخلي', m:'سجّل نتيجة تدقيق العينة على هذا الشاهد.', to:null, reason:true},
  }[a];
  if (cfg.need) return toast(cfg.need, 'bad');
  confirmModal(cfg.t, cfg.m, cfg.reason, reason => {
    const before = ST[e.st];
    if (a === 'audit'){ e.log.push({t:TODAY, who:u.name, a:'ملاحظة تدقيق: ' + reason}); S.audit.push(auditRow(u, 'تدقيق عينة', e.id, before, before, reason)); toast('سُجلت ملاحظة التدقيق', 'ok'); return refreshDrawer(e); }
    if (a === 'replace'){
      e.st = 'replaced'; const n = {...e, id: e.id + '-v2', st:'draft', files:[], comments:[], log:[{t:TODAY, who:u.name, a:'إنشاء إصدار جديد بديل عن ' + e.id}], upd:TODAY};
      S.ev.push(n); e.log.push({t:TODAY, who:u.name, a:'استبدال بالإصدار ' + n.id});
      S.audit.push(auditRow(u, 'استبدال شاهد معتمد', e.id, before, ST.replaced, 'إصدار جديد ' + n.id)); toast('أُنشئ الإصدار الجديد ' + n.id, 'ok'); closeDrawer(); render(); return openEv(n.id); }
    e.st = cfg.to; e.upd = TODAY; if (a === 'review') e.reviewedBy = u.id;
    e.log.push({t:TODAY, who:u.name, a:cfg.t + (reason ? ': ' + reason : '')});
    if (['approve','reject','return'].includes(a)) S.audit.push(auditRow(u, cfg.t, e.id, before, ST[e.st], reason));
    if (a === 'submit' || a === 'review') S.audit.push(auditRow(u, cfg.t, e.id, before, ST[e.st], ''));
    toast({submit:'أُرسل الشاهد للمراجعة', review:'بدأت المراجعة الأولى', return:'أُعيد الشاهد للتعديل', approve:'اعتُمد الشاهد', reject:'رُفض الشاهد'}[a], 'ok');
    refreshDrawer(e);
  });
}

/* ---------- documents ---------- */
function canDoc(a, d, u = S.user){
  if (a === 'approve'){
    if (u.role !== d.approverRole) return {ok:false, why: d.approverRole === 'TM' ? 'اعتماد السياسات للإدارة العليا' : 'اعتماد الوثائق لمدير الجودة'};
    if (d.prep === u.id) return {ok:false, why:'لا يجوز اعتماد محتوى أعددته بنفسك (الفصل بين المهام)'};
    return {ok: d.st === 'uploaded', why:'الوثيقة ليست بانتظار الاعتماد'};
  }
  if (a === 'replace') return {ok: d.st === 'approved' && d.prep === u.id, why:'إصدار جديد لمعدّ الوثيقة'};
  return {ok:false, why:''};
}
function documents(){

/* ---------- readiness ---------- */
function donut(parts, size=150){
  const tot = parts.reduce((s,p) => s + p.v, 0) || 1; let a = -Math.PI/2; const r = 56, c = size/2;
  const segs = parts.filter(p => p.v).map(p => { const a2 = a + 2*Math.PI*p.v/tot; const large = a2 - a > Math.PI ? 1 : 0;
    const d = `M ${c+r*Math.cos(a)} ${c+r*Math.sin(a)} A ${r} ${r} 0 ${large} 1 ${c+r*Math.cos(a2)} ${c+r*Math.sin(a2)}`; a = a2; return `<path d="${d}" fill="none" stroke="${p.c}" stroke-width="20"/>`; }).join('');
  const pct = Math.round(100 * parts[0].v / tot);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="نسبة الجاهزية ${pct}%"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}<text x="${c}" y="${c+8}" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" font-family="Readex Pro">${pct}%</text></svg>`;
}
function readinessPage(){

  return pageH('المستخدمون والأدوار', canEdit ? 'إدارة الحسابات والأدوار والإنابة المؤقتة — كل تغيير يُسجل في سجل التدقيق' : 'اعتماد التغييرات لمدير الجودة — التعديل لمدير النظام') + `
  <div class="card" style="margin-bottom:14px"><h3>الإنابة المؤقتة</h3>
   <div class="tbl-wrap"><table><thead><tr><th>عن</th><th>إلى</th><th>الدور</th><th>من</th><th>إلى</th><th>بواسطة</th><th>الحالة</th></tr></thead><tbody>
   ${S.delegations.map(d => `<tr><td>${esc(d.from)}</td><td>${esc(d.to)}</td><td>${d.role}</td><td class="num">${fmt(d.start)}</td><td class="num">${fmt(d.end)}</td><td>${esc(d.by)}</td><td><span class="badge st-rework">${esc(d.status)}</span></td></tr>`).join('')}</tbody></table></div>
   ${canEdit ? `<form id="delegForm" class="grid g4" style="margin-top:12px;align-items:end">
     <div class="field"><label for="dg-to">المُناب</label><select id="dg-to">${USERS.filter(u=>u.role!=='SA'&&!u.vacant).map(u => `<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select></div>
     <div class="field"><label for="dg-for">عن (الدور والنطاق)</label><select id="dg-for">${USERS.filter(u=>u.role!=='SA').map(u => `<option value="${u.id}">${esc(u.name)} (${u.role}${u.br?' '+u.br:''})</option>`).join('')}</select></div>
     <div class="field"><label for="dg-s">من</label><input id="dg-s" type="date" value="2026-10-06"></div>
     <div class="field"><label for="dg-e">إلى</label><input id="dg-e" type="date" value="2026-12-31"></div>
     <button class="btn primary" type="submit">إنشاء إنابة</button></form>` : ''}</div>
  <div class="tbl-wrap"><table><thead><tr><th>المستخدم</th><th>الدور</th><th>النطاق</th><th>الحالة</th></tr></thead><tbody>
  ${USERS.map(u => `<tr><td>${esc(u.name)} ${u.demo?'<span class="demo-flag">اسم يُستكمل</span>':''}</td><td>${u.role} — ${ROLE[u.role].name}</td><td>${esc(scopeLabel(u))}</td><td>${u.vacant?'<span class="badge st-rework">شاغر</span>':'<span class="badge st-approved">نشط</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- modal & toast ---------- */
function confirmModal(title, msg, needReason, onOk){
  const w = document.createElement('div'); w.className = 'overlay'; w.id = 'cmodal';
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><p style="margin:0;color:var(--ink-2)">${msg}</p>${needReason?'<div class="field"><label for="cm-r">السبب (إلزامي)</label><textarea id="cm-r" rows="3"></textarea></div>':''}
   <div class="acts"><button class="btn primary" id="cm-ok">تأكيد</button><button class="btn" id="cm-no">إلغاء</button></div></div>`;
  document.body.appendChild(w);
  $('#cm-no').onclick = () => w.remove();
  w.onclick = ev => { if (ev.target === w) w.remove(); };
  $('#cm-ok').onclick = () => { const r = needReason ? $('#cm-r').value.trim() : ''; if (needReason && !r) { toast('اكتب السبب قبل التأكيد', 'bad'); return; }
    const b = $('#cm-ok'); b.disabled = true; b.textContent = 'جارٍ التنفيذ…'; setTimeout(() => { w.remove(); onOk(r); }, 350); };
}
function toast(m, k=''){ const t = document.createElement('div'); t.className = 'toast ' + k; t.textContent = m; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200); }

/* ---------- binding ---------- */
function bind(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.view = b.dataset.go; render(); });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = ev => act(b.dataset.act, ev));
  document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { S.page = b.dataset.page; S.mobOpen = false; if (b.dataset.f) S.evF = {...S.evF, st:b.dataset.f, br:'', q:'', std:''}; loadPage(); });
  document.querySelectorAll('[data-ev]').forEach(b => b.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); openEv(b.dataset.ev); });
  if (S.view === 'login'){
    $('#lg-role').onchange = scopeField; scopeField();
    $('#loginForm').onsubmit = ev => { ev.preventDefault(); const em = $('#lg-email').value.trim();
      if (!/^\S+@\S+\.\S+$/.test(em)) { const e = $('#lg-err'); e.hidden = false; e.textContent = 'أدخل بريداً إلكترونياً صحيحاً، مثل name@mharat.com.sa'; return; }
      const u = pickUser(); S.user = u; S.view = 'app'; S.page = 'dash'; S.evF = {q:'', st:'', br:'', std:'', sort:'due', dir:1};
      S.audit.push(auditRow(u, 'تسجيل دخول', u.id, '—', '—', '')); render(); toast('مرحباً ' + u.name, 'ok'); };
  }
  if (S.view !== 'app') return;
  const q = $('#f-q'); if (q) q.oninput = () => { S.evF.q = q.value; const pos = q.selectionStart; render(); const n = $('#f-q'); n.focus(); n.setSelectionRange(pos, pos); };
  ['st','br','std'].forEach(k => { const s = $('#f-'+k); if (s) s.onchange = () => { S.evF[k] = s.value; render(); }; });
  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; S.evF.dir = S.evF.sort === k ? -S.evF.dir : 1; S.evF.sort = k; render(); });
  const rd = $('#r-dom'); if (rd) rd.onchange = () => { S.raciF.dom = rd.value; render(); };
  const rr = $('#r-role'); if (rr) rr.onchange = () => { S.raciF.role = rr.value; render(); };
  document.querySelectorAll('[data-tab]').forEach(t => t.onclick = () => { document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === t)); document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== t.dataset.tab); });
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => docAction(b.dataset.doc, b.dataset.da));
  document.querySelectorAll('[data-esc]').forEach(b => b.onclick = () => escAction(b.dataset.esc, b.dataset.ea));
  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => toast('توليد التقرير متاح في النسخة الإنتاجية (Laravel) بالقالب الرسمي', ''));
  const df = $('#delegForm'); if (df) df.onsubmit = ev => { ev.preventDefault(); const to = userById($('#dg-to').value), fr = userById($('#dg-for').value), s = $('#dg-s').value, e = $('#dg-e').value;
    if (!s || !e || e < s) return toast('حدد تاريخ بداية ونهاية صحيحين للإنابة', 'bad');
    if (to.id === fr.id) return toast('لا يمكن إنابة المستخدم عن نفسه', 'bad');
    confirmModal('إنشاء إنابة مؤقتة', `سيعمل ${to.name} بصلاحيات ${ROLE[fr.role].name} ضمن نطاق ${scopeLabel(fr)} من ${s} إلى ${e}، ويظهر «بالإنابة» في السجلات.`, false, () => {
      S.delegations.push({from:fr.name + ' (' + fr.role + ')', to:to.name, role:fr.role, start:s, end:e, by:S.user.name, status:'نشطة'});
      S.audit.push(auditRow(S.user, 'إنشاء تفويض', fr.id + ' ← ' + to.id, '—', 'إنابة حتى ' + e, 'إنابة مؤقتة', null, 'قرار مدير النظام'));
      toast('أُنشئت الإنابة وسُجلت في سجل التدقيق', 'ok'); render(); }); };
}
function loadPage(){
  $('#content') && ($('#content').innerHTML = '<div class="grid g4">' + '<div class="card"><div class="skel" style="width:60%"></div><div class="skel" style="margin-top:10px;height:28px;width:40%"></div></div>'.repeat(4) + '</div>');
  setTimeout(render, 180);
}
function act(a){
  if (a === 'theme'){ const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('mh-theme', r.dataset.theme); } catch(e){} }
  if (a === 'collapse'){ if (innerWidth <= 860) S.mobOpen = !S.mobOpen; else S.collapsed = !S.collapsed; render(); }
  if (a === 'logout'){ confirmModal('تسجيل الخروج', 'ستعود إلى الصفحة الرئيسية. البيانات التجريبية تبقى كما هي حتى تحديث الصفحة.', false, () => { S.user = null; S.view = 'public'; render(); }); }
  if (a === 'forgot') toast('سيُرسل رابط استعادة كلمة المرور إلى بريدك المسجل (في النسخة الإنتاجية)', '');
  if (a === 'clearF'){ S.evF = {...S.evF, q:'', st:'', br:'', std:''}; render(); }
  if (a === 'readAll'){ notifications().forEach(n => S.read.add(n.id)); render(); }
}
function docAction(id, a){
  const d = S.docs.find(x => x.id === id), r = canDoc(a, d); if (!r.ok) return toast(r.why, 'bad');
  if (a === 'approve') confirmModal('اعتماد الوثيقة', `سيُعتمد ${d.id} الإصدار ${d.ver} ويُسجل في سجل التدقيق.`, false, () => { d.st = 'approved'; S.audit.push(auditRow(S.user, 'اعتماد وثيقة', d.id, ST.uploaded, ST.approved, '')); toast('اعتُمدت الوثيقة', 'ok'); render(); });
  if (a === 'replace') confirmModal('إصدار جديد', `لا تُحذف الوثيقة المعتمدة. سيُؤرشف الإصدار ${d.ver} ويُنشأ إصدار جديد بانتظار الاعتماد.`, true, rs => { const v = (parseFloat(d.ver) + 0.1).toFixed(1); S.audit.push(auditRow(S.user, 'إصدار جديد لوثيقة', d.id, 'الإصدار ' + d.ver, 'الإصدار ' + v, rs)); d.ver = v; d.st = 'uploaded'; toast('أُنشئ الإصدار ' + v, 'ok'); render(); });
}
function escAction(id, a){
  const x = escalations().find(y => y.e.id === id);
  if (a === 'close') confirmModal('تسجيل إجراء على التصعيد', 'اكتب الإجراء المتخذ. سيُغلق التصعيد ويُسجل في سجل التدقيق.', true, r => { S.escNotes[id] = {...(S.escNotes[id]||{}), closed:true}; S.audit.push(auditRow(S.user, 'إغلاق تصعيد', id, 'م' + x.lvl + ' مفتوح', 'مغلق', r)); toast('سُجل الإجراء وأُغلق التصعيد', 'ok'); render(); });
  if (a === 'up') confirmModal('تصعيد للمستوى التالي', `سيُنقل التصعيد إلى المستوى ${x.lvl + 1}. اكتب السبب.`, true, r => { S.escNotes[id] = {lvl: x.lvl + 1, manual:true}; S.audit.push(auditRow(S.user, 'تصعيد يدوي', id, 'م' + x.lvl, 'م' + (x.lvl + 1), r)); toast('صُعّد إلى المستوى ' + (x.lvl + 1), 'ok'); render(); });
}
try { const t = localStorage.getItem('mh-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#cmodal')?.remove(); closeDrawer(); } });
render();
</script>
